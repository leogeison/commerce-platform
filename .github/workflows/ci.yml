name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-typecheck:
    runs-on: ubuntu-latest
    # Postgres real (QA-011) — antes só existia um DATABASE_URL fictício
    # (usado apenas para o config do Prisma carregar em "Generate Prisma
    # Client", nunca para conectar de verdade). Agora também é usado pelas
    # migrations reais e pela suíte e2e da API, abaixo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Mesmas credenciais que já eram usadas como valor fictício antes da
      # QA-011 — agora reais, apontando para o serviço postgres acima.
      # GitHub Actions só libera os passos do job depois do serviço ficar
      # healthy, então já está pronto quando "Generate Prisma Client" roda.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      # QA-011: suíte de testes do MVP. `pnpm --filter api test`/`pnpm
      # --filter admin test`/`pnpm --filter fastcompre test` não têm hook
      # `pretest` que builde @commerce-platform/contracts (só `test:e2e`
      # tem, via `pretest:e2e`) — sem este passo explícito, os três passos
      # de teste abaixo falham com "Cannot find module
      # '@commerce-platform/contracts'" (reproduzido antes de adicionar).
      - name: Build contracts
        run: pnpm --filter @commerce-platform/contracts build

      # @commerce-platform/ui exporta de `dist` (main/types/exports do seu
      # package.json) e precisa estar buildado antes de qualquer consumidor
      # — mesma razão do passo "Build contracts" acima.
      - name: Build UI package
        run: pnpm --filter @commerce-platform/ui build

      # UXF-007: gate real de packages/ui no CI — antes só era
      # exercitado indiretamente via `pnpm build`/`pnpm typecheck`
      # (que dependem dele), nunca com a suíte de teste (jest-axe
      # incluso) rodando de fato.
      - name: UI package tests
        run: pnpm --filter @commerce-platform/ui test

      # @commerce-platform/editorial exporta de `dist` (main/types/exports
      # do seu package.json), mesma razão dos passos "Build contracts"/
      # "Build UI package" acima. Sem este passo explícito, "Admin tests"
      # abaixo falha com "Cannot find module '@commerce-platform/editorial'"
      # num checkout limpo — reproduzido: funciona localmente só porque
      # `apps/admin`'s `prebuild`/`pretypecheck` já buildaram este pacote
      # como efeito colateral em algum momento anterior da sessão de
      # desenvolvimento, deixando um `dist/` residual (não versionado,
      # `.gitignore`) que não existe num checkout novo.
      - name: Build editorial package
        run: pnpm --filter @commerce-platform/editorial build

      # `test:coverage:domain` (QA-001) já roda a suíte unitária completa
      # da API e aplica o coverageThreshold (80/80/80/70) definido ali —
      # usado no lugar de `pnpm --filter api test` para que a QA-001 seja
      # um gate real do CI, sem rodar a suíte unitária duas vezes.
      - name: API unit tests + coverage gate
        run: pnpm --filter api test:coverage:domain

      - name: Admin tests
        run: pnpm --filter admin exec jest --runInBand

      - name: FastCompre tests
        run: pnpm --filter fastcompre test

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      # --runInBand: a suíte e2e completa (77 arquivos, cada um sobe uma
      # instância Nest própria) esgotou a memória do meu sandbox de
      # validação (3,8GB) rodando em paralelo; serial é determinístico e
      # já validado de ponta a ponta (~114s). Sem isso não há garantia de
      # que a suíte completa rode de forma confiável sob paralelismo
      # default do Jest neste runner.
      #
      # `pnpm --filter api test:e2e -- --runInBand` (forma óbvia) NÃO
      # funciona nesta versão do pnpm: `--filter` + `--` insere um `--`
      # literal antes do argumento repassado, e o Jest interpreta
      # "--runInBand" como padrão de nome de teste em vez de flag
      # (reproduzido: "Pattern: --runInBand - 0 matches", 0 testes
      # rodados). `working-directory` + `pnpm run` (sem `--filter`, sem
      # `--`) repassa a flag corretamente — validado rodando a suíte de
      # verdade.
      - name: API e2e tests
        working-directory: apps/api
        run: pnpm run test:e2e --runInBand

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # apps/fastcompre valida SITE_SLUG/API_URL assim que seu módulo de
          # config é importado — e `next build` importa esse módulo na
          # etapa de coleta de dados da rota, mesmo sem prerenderizar nada
          # de fato. As páginas que consultam a API adiam esse fetch para o
          # momento da requisição real, então nenhuma chamada de rede
          # acontece durante o build; os valores abaixo só precisam
          # satisfazer o schema de validação, não apontar para um endereço
          # acessível.
          SITE_SLUG: 'fastcompre'
          API_URL: 'http://127.0.0.1:9999'
          SITE_URL: 'https://fastcompre.invalid'
          AFFILIATE_REDIRECT_URL: 'https://fastcompre.invalid'
          REVALIDATION_SECRET: 'fastcompre-invalid-ci-secret-000'
          # UXW-013: `next.config.ts` chama `resolveStorageImagesConfig`
          # (apps/fastcompre/src/config/storage-remote-pattern.ts) na
          # avaliação do próprio módulo — e em produção (NODE_ENV=production,
          # o que `next build` usa mesmo para builds locais) essa função
          # lança se STORAGE_PUBLIC_URL_BASE estiver ausente/vazia ou não for
          # uma URL http(s) válida, sem nenhum fallback de desenvolvimento
          # (decisão intencional da UXW-013, preservada aqui — não
          # enfraquecida por este step). A função só faz parsing de URL para
          # montar `images.remotePatterns`; nenhum acesso real de rede/
          # storage ocorre durante o build. Valor sintético abaixo usa o TLD
          # reservado `.invalid` (RFC 2606), mesmo padrão já usado por
          # SITE_URL/AFFILIATE_REDIRECT_URL acima: satisfaz o parser sem
          # apontar para um host real, de produção ou roteável.
          STORAGE_PUBLIC_URL_BASE: 'https://storage.fastcompre.invalid'
          # apps/admin valida NEXT_PUBLIC_API_URL da mesma forma (env.ts,
          # ADM-001) — `next build` executa esse parse ao prerenderizar
          # páginas como /login que importam api-client.ts. Mesma lógica do
          # fastcompre acima: o artefato de CI não é deployado, então o
          # valor só precisa ser uma origem sintaticamente válida.
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:9999'

  # UXQ-001 — job dedicado, separado do job unit/e2e/build acima (critério
  # explícito do backlog: tempos de execução diferentes não devem ficar
  # acoplados). Só prova o scaffold Playwright + `@axe-core/playwright`
  # contra build real do Admin e do FastCompre — cenários completos
  # (UXQ-002/UXQ-003) ainda não existem.
  #
  # Container pinado na MESMA versão de `@playwright/test` resolvida no
  # lockfile (`1.62.1`, confirmado em `pnpm-lock.yaml`) — o Chromium já vem
  # pré-instalado nessa imagem, então nenhum `playwright install` é
  # necessário aqui (reuso do binário já resolvido pela própria imagem, em
  # vez de um novo download).
  #
  # Sem serviço Postgres/Prisma/migrations: diferente do job acima, este
  # job nunca builda `apps/api` nem depende de `@prisma/client` — Admin e
  # FastCompre consomem a API só via HTTP (mockado pelos próprios
  # harnesses de `e2e-a11y/`), nunca via Prisma direto.
  a11y-playwright:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mesma ordem/motivo já documentado no job `build-lint-typecheck`
      # acima: Admin e FastCompre consomem `@commerce-platform/contracts`/
      # `ui`/`editorial` a partir de `dist`, que não existe num checkout
      # limpo. Explícito aqui (em vez de confiar só nos hooks `prebuild`
      # de cada app) para que a ordem de preparação fique garantida e
      # legível no próprio pipeline, evitando o tipo de problema de
      # ambiente observado na verificação da UXW-016 (dependência local
      # corrompida/incompleta mascarando o que de fato precisa existir
      # antes do build).
      - name: Build contracts
        run: pnpm --filter @commerce-platform/contracts build

      - name: Build UI package
        run: pnpm --filter @commerce-platform/ui build

      - name: Build editorial package
        run: pnpm --filter @commerce-platform/editorial build

      # Cada `test:a11y` sobe seu próprio build de produção real via
      # `webServer` do Playwright (nunca `next dev`) — ver
      # `apps/admin/e2e-a11y/playwright.config.ts` e
      # `apps/fastcompre/e2e-a11y/playwright.config.ts`. Dois steps
      # separados (não um `pnpm -r`) para que o relatório de CI aponte
      # exatamente qual app falhou.
      - name: Admin a11y smoke (Playwright + axe)
        run: pnpm --filter admin test:a11y

      - name: FastCompre a11y smoke (Playwright + axe)
        run: pnpm --filter fastcompre test:a11y
