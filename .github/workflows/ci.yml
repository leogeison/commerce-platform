name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
        env:
          # prisma.config.ts usa env('DATABASE_URL') (helper de
          # prisma/config), que lança erro se a variável não existir —
          # mesmo `prisma generate` nunca abrindo conexão real com o banco.
          # Valor fictício, só para o config carregar; nunca usado para
          # conectar em nada.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # apps/fastcompre valida SITE_SLUG/API_URL assim que seu módulo de
          # config é importado — e `next build` importa esse módulo na
          # etapa de coleta de dados da rota, mesmo sem prerenderizar nada
          # de fato. As páginas que consultam a API adiam esse fetch para o
          # momento da requisição real, então nenhuma chamada de rede
          # acontece durante o build; os valores abaixo só precisam
          # satisfazer o schema de validação, não apontar para um endereço
          # acessível.
          SITE_SLUG: 'fastcompre'
          API_URL: 'http://127.0.0.1:9999'
