services:
  postgres:
    image: postgres:16
    container_name: commerce-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commerce_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d commerce_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Storage S3-compatível para desenvolvimento local (UPL-008/UPL-009,
  # Architecture.md Seção 29) — infraestrutura apenas; `S3StorageAdapter`
  # já é agnóstico de provedor e não muda. Imagem via `quay.io`, não
  # `docker.io/minio/minio`: a distribuição de imagens do MinIO Community
  # Edition no Docker Hub foi descontinuada em outubro/2025, e o próprio
  # compose oficial arquivado do projeto (`minio/minio` no GitHub,
  # `docs/orchestration/docker-compose/docker-compose.yaml`) já usa
  # `quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z` — mesma tag fixada
  # aqui, por ter essa referência direta. Credenciais e bucket são valores
  # fixos de desenvolvimento local, sem correspondência com nenhum
  # ambiente real.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: commerce-platform-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-dev-access-key
      MINIO_ROOT_PASSWORD: local-dev-secret-key-change-me
    ports:
      - "9000:9000" # API S3 — usada pela API (upload) e pelo navegador (leitura das imagens)
      - "9001:9001" # console web do MinIO — só para depuração visual local
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc ready local` é a checagem recomendada pelo próprio MinIO — a
      # imagem não inclui `curl`, então um healthcheck via HTTP não funciona.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço de inicialização: roda uma vez, cria o bucket `local-dev-bucket`
  # (idempotente, `--ignore-existing`) e libera leitura anônima só nele —
  # sem isso, o `<img src>` do Admin/FastCompre receberia `403 AccessDenied`
  # do MinIO, já que buckets nascem privados. Nenhum passo manual no console.
  # Tag do `mc` confirmada como a mais recente realmente publicada
  # (`minio/mc`, GitHub releases, 2025-09-07) — não é inventada por simetria
  # com a tag do servidor acima.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: commerce-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 local-dev-access-key local-dev-secret-key-change-me &&
      mc mb --ignore-existing local/local-dev-bucket &&
      mc anonymous set download local/local-dev-bucket &&
      exit 0
      "

  # Serviço one-shot (QA-010): aplica as migrations do Prisma contra o
  # Postgres do compose antes da API subir. Usa o estágio `build` do
  # Dockerfile (não `runtime`) porque só ele tem a CLI do Prisma
  # (devDependency de apps/api) e a pasta `prisma/` — a imagem final da
  # API (`runtime`) não carrega nenhum dos dois de propósito.
  # `prisma migrate deploy` é idempotente: uma segunda subida com o volume
  # `postgres_data` já migrado só constata que não há migration pendente e
  # sai 0, sem reaplicar nada.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: commerce-platform-migrate
    env_file:
      - apps/api/.env
    environment:
      # localhost não resolve entre containers — dentro da rede do
      # compose, o Postgres é alcançado pelo nome do serviço.
      DATABASE_URL: postgresql://user:password@postgres:5432/commerce_platform
    depends_on:
      postgres:
        condition: service_healthy
    # Invoca o binário do Prisma já instalado pelo `pnpm install` do estágio
    # `build` diretamente (não via `pnpm --filter api exec ...`). Motivo
    # (QA-010, investigado e reproduzido): `pnpm exec`, nesta versão do
    # pnpm (11.x), roda uma verificação de estado ("deps status check")
    # antes do comando de verdade que, depois de um `pnpm deploy --legacy`
    # já ter rodado nesta mesma árvore (etapa anterior do estágio `build`),
    # tenta silenciosamente reconciliar reinstalando com `pnpm install
    # --production` — o que exigiria remover as devDependencies do
    # node_modules e pede confirmação interativa
    # (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY sem TTY). Reproduzido e
    # isolado antes de aplicar: o gatilho é exatamente essa sequência
    # (exec após deploy --legacy na mesma árvore), não a CLI do Prisma.
    # Chamar o binário direto evita passar pelo `pnpm exec` inteiramente —
    # determinístico, sem reinstalar/reorganizar node_modules no startup.
    working_dir: /repo/apps/api
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]

  # API (QA-010): imagem "local-runtime", buildada uma vez via `docker
  # compose up --build` — não é o fluxo de desenvolvimento com hot-reload
  # (esse continua sendo `pnpm dev:api`, fora do Docker, intocado).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: commerce-platform-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Mesma lógica do `migrate`: hostname do serviço, não localhost.
      DATABASE_URL: postgresql://user:password@postgres:5432/commerce_platform
      # SDK S3 roda DENTRO do container — precisa do hostname do serviço
      # MinIO na rede do compose. STORAGE_S3_PUBLIC_URL_BASE (apps/api/.env)
      # continua http://localhost:9000/... de propósito: é resolvido pelo
      # navegador, não pela API.
      STORAGE_S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # GET /health (health.controller.ts) via Node puro — a imagem
      # runtime (node:22-bookworm-slim) não tem curl/wget por padrão, e
      # Node já está lá de qualquer forma.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
